services:
  anki:
    image: ghcr.io/ankimcp/headless-anki:x11-vnc-v1.2.0
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        ADDON_DIR=/data/addons21/2055492159
        if [ ! -f "$$ADDON_DIR/config.json" ]; then
          echo "Installing AnkiConnect into $$ADDON_DIR..."
          mkdir -p "$$ADDON_DIR"
          curl -sL -o /tmp/ac.zip \
            "https://ankiweb.net/shared/download/2055492159?v=2.1&p=250902"
          unzip -q /tmp/ac.zip -d "$$ADDON_DIR/"
          rm /tmp/ac.zip
          jq '.webBindAddress="0.0.0.0"' "$$ADDON_DIR/config.json" > /tmp/c.json
          mv /tmp/c.json "$$ADDON_DIR/config.json"
        fi
        exec /startup.sh
    volumes:
      - anki_data:/data
      - imports:/imports
    ports:
      - "5900:5900"
      - "8765:8765"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8765"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s

  bot:
    build: ./bot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ANKI_CONNECT_URL=http://anki:8765
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS:-}
      - DEFAULT_DECK=${DEFAULT_DECK:-Imported}
      - IMPORTS_DIR=/imports
    volumes:
      - imports:/imports
    depends_on:
      anki:
        condition: service_healthy
    restart: unless-stopped

volumes:
  anki_data:
  imports:
