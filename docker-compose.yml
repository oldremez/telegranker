services:
  anki:
    image: ghcr.io/ankimcp/headless-anki:x11-vnc-v1.2.0
    entrypoint: ["/bin/bash", "/bootstrap.sh"]
    environment:
      - ANKIWEB_EMAIL=${ANKIWEB_EMAIL:-}
      - ANKIWEB_PASSWORD=${ANKIWEB_PASSWORD:-}
    volumes:
      - anki_data:/data
      - imports:/imports
      - ./anki/bootstrap.sh:/bootstrap.sh:ro
      - ./anki/auto_sync_login:/data/addons21/auto_sync_login:ro
    ports:
      - "5900:5900"
      - "8765:8765"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8765"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s

  bot:
    build: ./bot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ANKI_CONNECT_URL=http://anki:8765
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS:-}
      - DEFAULT_DECK=${DEFAULT_DECK:-Greek}
      - IMPORTS_DIR=/imports
    volumes:
      - imports:/imports
    depends_on:
      anki:
        condition: service_healthy
    restart: unless-stopped

volumes:
  anki_data:
  imports:
